services:
  bot:
    build: .
    # Имя образа задано явно, чтобы можно было собрать его отдельной
    # командой. На серверах, где firewall не пускает сборочную сеть
    # к DNS, собирайте так:  docker build --network=host -t trading-signals-bot .
    image: trading-signals-bot:latest
    container_name: trading-signals-bot
    restart: unless-stopped
    env_file: .env
    # Портов нет намеренно: бот сам звонит в Telegram и наружу
    # ничего не слушает. Открывать в интернет нечего.
    volumes:
      - ./data:/app/data      # журнал сигналов и настройки переживают пересборку
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    # Подсеть зафиксирована намеренно: на серверах, где исходящий трафик
    # заворачивается в VPN по адресу источника, правило firewall ссылается
    # именно на неё. Плавающая подсеть ломала бы это правило при пересоздании.
    ipam:
      config:
        - subnet: ${BOT_SUBNET:-172.28.0.0/16}
