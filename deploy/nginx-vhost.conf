# Шаблон vhost для Mini App за существующим nginx.
#
# ЗАМЕНИТЬ ПЕРЕД ИСПОЛЬЗОВАНИЕМ:
#   BOT_DOMAIN  — домен приложения, например bot.example.com
#   BOT_HOST    — адрес, на котором слушает контейнер (BIND_HOST из .env)
#   BOT_PORT    — его порт (BIND_PORT из .env)
#
# Порядок установки — в два шага, одним не выйдет: nginx не стартует
# со ссылкой на ещё не выпущенный сертификат.
#
#   1) положить временный конфиг только с блоком listen 80 и локацией
#      /.well-known/acme-challenge/, перезагрузить nginx;
#   2) выпустить сертификат:
#      certbot certonly --webroot -w /var/www/certbot -d BOT_DOMAIN
#   3) положить этот файл целиком и перезагрузить nginx.
#
map $http_upgrade $bot_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name BOT_DOMAIN;

    # ACME http-01 для выпуска и обновления сертификата — должен оставаться на 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    # HTTP/3 намеренно НЕ включён, в отличие от соседних сайтов.
    # QUIC опубликован только на внешнем адресе (5.167.50.197:443/udp),
    # а из локальной сети домен резолвится в BOT_HOST, где UDP-порт
    # не слушает никто. Браузер обычно откатывается на TCP, но webview
    # Telegram — не всегда. Надёжность здесь важнее лишнего протокола.
    server_name BOT_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/BOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/BOT_DOMAIN/privkey.pem;

    # Полгода, как у соседей. Без preload — попадание в списки браузеров
    # необратимо, и снять домен оттуда быстро нельзя.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Заголовок frame-ancestors здесь НЕ ставится намеренно.
    # Telegram открывает Mini App в родном webview (Desktop, Android, iOS),
    # и источник родителя там не web.telegram.org — любой белый список
    # ломает приложение: клиент просто отказывается рисовать страницу.
    # Защита приложения держится на подписи initData, а не на рамках.
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://BOT_HOST:BOT_PORT;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Приложение опрашивает состояние раз в 30 секунд
        proxy_read_timeout 120s;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $bot_connection_upgrade;
    }

    # Статика приложения кешируется, API — никогда.
    # Буферы увеличены: библиотека графиков весит 160 КБ, и на умолчаниях
    # nginx сбрасывал её во временный файл, ругаясь в лог на каждой загрузке.
    location /static/ {
        proxy_pass http://BOT_HOST:BOT_PORT;
        proxy_set_header Host $host;

        proxy_buffers 16 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;

        expires 1h;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://BOT_HOST:BOT_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}
