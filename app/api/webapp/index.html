<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Торговые сигналы</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322c55e'/%3E%3Cpath d='M7 21l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- График свечей: библиотека TradingView, лежит локально,
       чтобы приложение не зависело от доступности CDN -->
  <script src="/static/vendor/lightweight-charts.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title">
      <span id="screen-title">Обзор</span>
      <span class="live-dot" id="live-dot" title="Связь с ботом"></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="help-btn" aria-label="Помощь">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-2.9 3-2.9 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </button>
      <button class="icon-btn" id="refresh-btn" aria-label="Обновить">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
      </button>
    </div>
  </header>

  <main id="content">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Загружаю данные…</p>
    </div>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-screen="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h4l3 8 4-16 3 8h4"/>
      </svg>
      <span>Обзор</span>
    </button>
    <button class="tab" data-screen="signals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>
      </svg>
      <span>Сигналы</span>
      <i class="badge" id="tab-badge" hidden></i>
    </button>
    <button class="tab" data-screen="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg>
      <span>Статистика</span>
    </button>
    <button class="tab" data-screen="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Настройки</span>
    </button>
  </nav>

</div>

<!-- Модальное окно выбора инструментов -->
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <b>Инструменты</b>
      <button class="icon-btn" id="sheet-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="filters" id="sheet-brokers"></div>
    <input class="sheet-search" id="symbol-search" type="search"
           placeholder="Поиск: XAU, BTC, ETH…" autocomplete="off">
    <div class="sheet-body" id="symbol-list"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
